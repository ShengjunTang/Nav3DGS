<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#050b10" />
    <meta
      name="description"
      content="导入 3DGS 场景与相机轨迹，在浏览器本地生成实景导航工程。"
    />
    <title>GaussNav - 3D 实景导航生成器</title>
  </head>
  <body>
    <div id="root">
      <div id="boot-status" style="min-height:100vh;display:grid;place-items:center;padding:24px;background:#050b10;color:#9eb1b9;font:14px -apple-system,BlinkMacSystemFont,sans-serif;text-align:center">
        正在启动 GaussNav…
      </div>
    </div>
    <div id="boot-error" style="display:none;position:fixed;inset:0;z-index:99999;place-items:center;padding:24px;background:#050b10;color:#9eb1b9;font:14px -apple-system,BlinkMacSystemFont,sans-serif;text-align:center"></div>
    <script>
      window.showGaussNavBootError = function (error) {
        var target = document.getElementById("boot-error");
        if (!target) return;
        var reason = error && error.reason;
        var message = error && (error.message || reason && (reason.message || String(reason)) || error.type) || "未提供错误信息";
        var stage = window.__gaussNavStage || "loading-module";
        target.style.display = "grid";
        target.innerHTML = "<div><b style='display:block;color:#ff927a;margin-bottom:10px'>GaussNav 启动失败</b><span style='font-size:12px;line-height:1.6'>"
          + String(message).replace(/[&<>]/g, function (character) { return ({ "&": "&amp;", "<": "&lt;", ">": "&gt;" })[character]; })
          + "</span><small style='display:block;margin-top:12px;color:#657984'>阶段：" + stage + "<br>请截图此信息并发送给开发者</small></div>";
      };
      window.addEventListener("error", function (event) { window.showGaussNavBootError(event.error || event.message); });
      window.addEventListener("unhandledrejection", function (event) { window.showGaussNavBootError(event); });
    </script>
    <script type="module">
      import("/src/main.tsx").catch(window.showGaussNavBootError);
    </script>
  </body>
</html>
